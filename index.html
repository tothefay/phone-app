<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Phone</title>
<style>
:root{box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#050506;overflow:hidden;font-family:"SFT",-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai","Sukhumvit Set",sans-serif;-webkit-font-smoothing:antialiased}
#ph{--bg:#000;--card:#1c1c1e;--fg:#fff;--sub:#8e8e93;--line:#38383a;--fill:#2c2c2e;--in:#262629;--cbg:#000;--ac:#0a84ff;position:fixed;inset:0;margin:auto;width:100%;max-width:430px;height:100%;background:#000 center/cover;overflow:hidden;color:var(--fg)}
#ph.lt{--bg:#f2f2f7;--card:#fff;--fg:#000;--line:#c6c6c8;--fill:#e5e5ea;--in:#e9e9eb;--cbg:#fff}
@media(min-width:500px){#ph{height:min(100%,880px);border-radius:56px;box-shadow:0 0 0 10px #1a1a1d,0 0 0 12px #3a3a3e,0 30px 80px #000}}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}
#sb{position:absolute;top:0;left:0;right:0;z-index:20;height:calc(env(safe-area-inset-top,0px) + 54px);padding:calc(env(safe-area-inset-top,0px) + 18px) 30px 0 40px;display:flex;justify-content:space-between;font-weight:600;font-size:16px;color:var(--fg);pointer-events:none;letter-spacing:-.2px}
#ph.w #sb{color:#fff}
#sb span+span{display:flex;gap:6px;align-items:center}
#di{position:absolute;top:calc(env(safe-area-inset-top,0px) + 11px);left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:21}
#hi{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:180px;height:30px;z-index:22;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer}
#hi i{width:136px;height:5px;border-radius:3px;background:var(--fg)}#ph.w #hi i{background:#fff}
#sc{position:absolute;inset:0}
.pg{position:absolute;inset:0;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 54px);display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{transform:translateX(28px);opacity:.3}}
.nv{display:flex;justify-content:space-between;align-items:center;padding:4px 16px;min-height:40px;color:var(--ac);font-size:17px}
.bk{display:flex;align-items:center;gap:6px;color:var(--ac);font-size:17px}
.nv b{font-size:26px;font-weight:300;line-height:1;padding:0 4px}
h1{margin:2px 16px 8px;font-size:34px;font-weight:700;letter-spacing:.3px}
.bd{flex:1;overflow-y:auto;padding:4px 16px 100px}
.gl{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:20px}
.rw{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.rw:not(:last-child)::after{content:"";position:absolute;left:var(--ins,16px);right:0;bottom:0;border-bottom:.5px solid var(--line)}
.rw b{display:block;font-weight:600;font-size:16.5px}.rw small{display:block;color:var(--sub);font-size:14.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rw .f{flex:1;min-width:0}.rw time{color:var(--sub);font-size:14px;align-self:flex-start;margin-top:2px}
.av{width:50px;height:50px;border-radius:50%;background:linear-gradient(#a5acb8,#7d8591) center/cover;display:grid;place-items:center;font-size:24px;color:#fff;font-weight:500;flex:none;overflow:hidden}
.ic{display:block;width:60px;height:60px;border-radius:22.4%;overflow:hidden;position:relative;box-shadow:inset 0 0 0 .5px #0002}.ic svg{width:100%;height:100%;display:block}
.ic.s{width:29px;height:29px;border-radius:7px}
.hm{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 62px) 20px 0;display:flex;flex-direction:column;color:#fff}
.wd{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px;padding:16px;margin-bottom:6px;height:110px}
.wd .av{width:64px;height:64px;font-size:32px}.wd b{font-size:19px}.wd div div{font-size:14px;opacity:.85;margin-top:2px}
.wl{text-align:center;font-size:11.5px;opacity:.85;margin-bottom:22px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-shadow:0 1px 4px #0006;cursor:pointer}
.ap .ic{box-shadow:none}
.dots{margin:auto 0 12px;display:flex;justify-content:center;gap:8px}.dots i{width:7px;height:7px;border-radius:50%;background:#fff6}.dots i:first-child{background:#fff}
.dk{margin:0 -8px 26px;padding:14px 14px;border-radius:36px;background:rgba(255,255,255,.22);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:grid;grid-template-columns:repeat(4,1fr)}
.lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 66px);cursor:pointer;text-shadow:0 2px 14px #0004}
.lk .d{font-size:20px;font-weight:600;opacity:.9;margin-top:6px}.lk .t{font-size:92px;font-weight:600;line-height:1;letter-spacing:-1px}
.nt{margin:auto 14px 14px;width:calc(100% - 28px);display:flex;gap:10px;padding:12px;border-radius:22px;background:rgba(40,40,44,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);text-align:left;text-shadow:none}
.nt b{font-size:15px}.nt div{font-size:14.5px;line-height:1.3}.nt small{margin-left:auto;opacity:.6;font-size:12.5px}
.lb{display:flex;justify-content:space-between;width:100%;padding:0 46px 52px}
.lb i{width:50px;height:50px;border-radius:50%;background:rgba(40,40,44,.55);backdrop-filter:blur(20px);display:grid;place-items:center;font-style:normal;font-size:21px}
.lh{font-size:13px;opacity:.75;margin-bottom:8px}
.ch{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0 6px;font-size:11.5px;position:relative;border-bottom:.5px solid var(--line);background:var(--bg)}
.ch .av{width:44px;height:44px;font-size:21px}.ch .bk{position:absolute;left:12px;top:10px}
.cm{flex:1;overflow-y:auto;background:var(--cbg);padding:10px 14px 8px;display:flex;flex-direction:column}
.tm{text-align:center;color:var(--sub);font-size:11.5px;margin:4px 0 8px}
.bb{position:relative;max-width:75%;padding:7px 13px;border-radius:19px;background:var(--in);font-size:16.5px;line-height:1.3;white-space:pre-wrap;word-break:break-word;align-self:flex-start;margin-top:2px;letter-spacing:-.2px}
.bb.me{align-self:flex-end;background:var(--ac);color:#fff}
.bb.tl::before,.bb.tl::after{content:"";position:absolute;bottom:0}
.bb.tl::before{left:-7px;width:20px;height:18px;background:var(--in);border-bottom-right-radius:16px 14px}
.bb.tl::after{left:-26px;width:26px;height:18px;background:var(--cbg);border-bottom-right-radius:10px}
.bb.me.tl::before{left:auto;right:-7px;background:var(--ac);border-radius:0 0 0 16px/0 0 0 14px}
.bb.me.tl::after{left:auto;right:-26px;border-radius:0 0 0 10px}
.rd{align-self:flex-end;font-size:11px;color:var(--sub);margin:3px 4px 0;font-weight:500}
.ib{display:flex;align-items:center;gap:8px;padding:8px 10px 38px;background:var(--cbg)}
.ib button.sd{width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--sub);font-size:11px;font-weight:600;flex:none}
.ib input{flex:1;min-width:0;background:none;border:.5px solid var(--line);border-radius:19px;padding:7px 14px;outline:0;font-size:16.5px}
.ib .go{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;font-size:16px;font-weight:700}
.gp{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -16px}
.gp div{aspect-ratio:1;background:var(--card) center/cover;cursor:pointer}
.cd{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:14px}.cd img{width:100%;border-radius:10px;margin-top:8px}
.sh{position:absolute;inset:0;z-index:30;background:#0007;display:flex;align-items:flex-end;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sh>div{width:100%;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:0 16px 40px}
.sh .nv{padding:14px 0 6px;color:var(--ac)}.sh .nv span{font-weight:600;color:var(--fg);font-size:17px}
.sh label{display:block;font-size:12.5px;color:var(--sub);margin:12px 12px 5px;text-transform:uppercase;letter-spacing:.3px}
.sh input,.sh textarea{display:block;width:100%;background:var(--card);border:0;border-radius:11px;padding:11px 14px;outline:0;font-size:16.5px}
.sh textarea{min-height:100px;resize:vertical}
.dl{width:100%;margin-top:24px;padding:12px;background:var(--card);border-radius:11px;color:#ff453a;font-size:17px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:.2s}.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:.2s}
.sw.on{background:#34c759}.sw.on::after{left:22px}
.mp{position:absolute;left:10px;right:10px;bottom:34px;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:16px;background:var(--card);box-shadow:0 4px 20px #0006;font-size:15px;font-weight:600}
.cs{display:flex;gap:10px}.cs i{width:32px;height:32px;border-radius:50%;cursor:pointer}
.em{text-align:center;color:var(--sub);padding:50px 0;font-size:15px}
@keyframes pb{from{width:0}}
.sr{display:flex;gap:12px;overflow-x:auto;padding:4px 0 14px}.sr>div{flex:none;text-align:center;font-size:12px;width:70px;cursor:pointer}.rg{width:68px;height:68px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#fdb45c,#e1306c,#5b51d8);margin-bottom:4px}.rg.no{background:var(--fill)}.rg .av{width:100%;height:100%;border:3px solid var(--bg)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:2px}.cg span{font-size:12px;color:var(--sub);font-weight:600;padding-bottom:4px}.cg button{height:48px;display:flex;flex-direction:column;align-items:center;font-size:18px}.cg button b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:400}.cg .td b{color:#ff3b30;font-weight:600}.cg .sl b{background:#ff3b30;color:#fff}.cg i{width:5px;height:5px;border-radius:50%;background:var(--sub);margin-top:1px}
.sg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:14px}.sg button{flex:1;padding:6px;border-radius:7px;font-size:14px;font-weight:500}.sg .on{background:var(--card);font-weight:600}
.sh input[type=color]{height:44px;padding:4px}
.up{display:flex;align-items:center;gap:12px;margin-top:8px}.up label{flex:1;text-align:center;background:var(--card);color:var(--ac);border-radius:11px;padding:12px;font-size:16px;cursor:pointer}.up img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none}.sh .up input{display:none}
.bb.im{padding:3px;max-width:65%}.bb.im img,.bb img{display:block;width:100%;border-radius:16px}.bb img+*{margin-top:4px}
.kp{display:grid;grid-template-columns:repeat(3,78px);gap:16px 24px}.kp button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;line-height:1;transition:background .15s}.kp button:active{background:rgba(255,255,255,.55)}.kp button small{font-size:10px;letter-spacing:2px;margin-top:2px;font-weight:600;height:10px}
@keyframes sk{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}.shk{animation:sk .4s}
#di,#sb{z-index:45}#hi{z-index:46}#ph.sv #sb{opacity:0}
.tb{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--bg);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding-top:12px;z-index:5}.tb button{color:var(--fg);opacity:.5;height:30px}.tb .on{opacity:1}
.dtp input{background:var(--fill);border:0;border-radius:8px;padding:5px 8px;color:var(--fg);font:inherit;font-size:13px;min-width:0}
#sc.na .pg{animation:none!important}#ph[data-f=home] .pg{animation:zin .28s cubic-bezier(.2,.8,.2,1)}@keyframes zin{from{transform:scale(.85);opacity:0;border-radius:44px}}
.iw{position:relative;display:block}.bdg{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:14px;font-weight:600;display:grid;place-items:center;padding:0 6px;z-index:2;box-shadow:0 0 0 1px #0002}
.srch{align-self:center;margin:0 0 14px;padding:7px 34px;border-radius:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;color:#fff}
#sb{--inv:var(--bg)}#ph.w #sb{--inv:#000}
.tb button{opacity:.92;padding:0 16px;height:42px;border-radius:22px;display:flex;align-items:center;justify-content:center}.tb .on{background:var(--fill);opacity:1}
.ro button[onclick*="edit"]:not([style*="gap:6px"]),.ro span[onclick*="edit"],.ro div[onclick^="editHl"],.ro div[onclick^="editTw"],.ro button[onclick^="ord="],.ro .ib,.ro .dtp,.ro div:has(>.sg[style*="margin:0"]),.ro div:has(>#wq),.ro div[onclick^="editCmt"]:not([onclick*="','"]),.ro div[onclick="imp()"],.ro div[onclick="editBadge()"],.ro div[onclick*="cf("]{display:none!important}
